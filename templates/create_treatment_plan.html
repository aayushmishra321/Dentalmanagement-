{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Treatment Plan</title>
    <link rel="stylesheet" href="{% static 'cssfiles/responsive-base.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .form-container { padding: 40px; }
        .patient-info {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
        }
        .patient-info p { color: #2e7d32; font-size: 14px; margin: 5px 0; }
        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #f5f5f5;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .btn-back:hover { background: #e0e0e0; }
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Create Treatment Plan</h1>
            <p>Design a comprehensive treatment plan for your patient</p>
        </div>
        <div class="form-container">
            <div class="patient-info">
                <p><strong>Patient:</strong> {{ patient.name }}</p>
                <p><strong>Email:</strong> {{ patient.email }}</p>
                <p><strong>Contact:</strong> {{ patient.contact }}</p>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="title">Treatment Plan Title *</label>
                    <input type="text" name="title" id="title" required placeholder="e.g., Complete Dental Restoration">
                </div>
                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea name="description" id="description" required placeholder="Detailed description of the treatment plan..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="total_sessions">Total Sessions *</label>
                        <input type="number" name="total_sessions" id="total_sessions" required min="1" max="50">
                    </div>
                    <div class="form-group">
                        <label for="total_cost">Total Cost (₹) *</label>
                        <input type="number" name="total_cost" id="total_cost" required min="0" step="0.01">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="start_date">Start Date *</label>
                        <input type="date" name="start_date" id="start_date" required>
                    </div>
                    <div class="form-group">
                        <label for="estimated_end_date">Estimated End Date *</label>
                        <input type="date" name="estimated_end_date" id="estimated_end_date" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Create Treatment Plan</button>
            </form>
            <a href="{% url 'doctor_dashboard' email %}" class="btn-back">← Back to Dashboard</a>
        </div>
    </div>
    <script>
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('start_date').setAttribute('min', today);
        document.getElementById('start_date').addEventListener('change', function() {
            document.getElementById('estimated_end_date').setAttribute('min', this.value);
        });
    </script>
</body>
</html>
