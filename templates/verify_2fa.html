{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify 2FA</title>
    <link rel="stylesheet" href="{% static 'cssfiles/responsive-base.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .content { padding: 40px; }
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
        }
        .info-box p { color: #555; font-size: 14px; line-height: 1.6; }
        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .resend-link {
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            font-size: 14px;
        }
        .resend-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .resend-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Verify Your Identity</h1>
            <p>Enter the 6-digit code sent to your email</p>
        </div>
        <div class="content">
            <div class="info-box">
                <p><strong>Email:</strong> {{ email }}</p>
                <p style="margin-top: 10px;">We've sent a 6-digit verification code to your email. Please enter it below to complete your login.</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="otp_code">Verification Code</label>
                    <input type="text" name="otp_code" id="otp_code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000" autofocus>
                </div>
                <button type="submit" class="btn-submit">Verify & Login</button>
            </form>
            
            <div class="resend-link">
                <p>Didn't receive the code? <a href="{% url 'request_2fa_otp' %}">Resend Code</a></p>
            </div>
        </div>
    </div>
    
    <script>
        // Auto-focus and format OTP input
        const otpInput = document.getElementById('otp_code');
        otpInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
