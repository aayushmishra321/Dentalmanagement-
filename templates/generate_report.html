<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Report - Dental Management</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'cssfiles/responsive-base.css' %}">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .report-container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        select, input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        select:focus, input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .submit-btn {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .back-btn {
            flex: 1;
            background: #6c757d;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .back-btn:hover {
            background: #5a6268;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .info-box p {
            margin: 0;
            color: #1976D2;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .report-container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="report-container">
        <h1>📄 Generate Report</h1>
        <p class="subtitle">Create custom reports for your dental practice</p>

        <div class="info-box">
            <p>💡 Select report type and format to generate comprehensive analytics</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="report_type">Report Type</label>
                <select name="report_type" id="report_type" required>
                    <option value="">Select Report Type</option>
                    <option value="daily_appointments">Daily Appointments</option>
                    <option value="monthly_revenue">Monthly Revenue</option>
                    <option value="patient_statistics">Patient Statistics</option>
                    <option value="doctor_performance">Doctor Performance</option>
                </select>
            </div>

            <div class="form-group">
                <label for="file_format">File Format</label>
                <select name="file_format" id="file_format" required>
                    <option value="pdf">PDF</option>
                    <option value="csv">CSV</option>
                </select>
            </div>

            <div class="form-group">
                <label for="start_date">Start Date (Optional)</label>
                <input type="date" name="start_date" id="start_date">
            </div>

            <div class="form-group">
                <label for="end_date">End Date (Optional)</label>
                <input type="date" name="end_date" id="end_date">
            </div>

            <div class="btn-group">
                <button type="submit" class="submit-btn">Generate Report</button>
                <a href="{% url 'analytics_dashboard' %}" class="back-btn">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
