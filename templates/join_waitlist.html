{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Waitlist</title>
    <link rel="stylesheet" href="{% static 'cssfiles/responsive-base.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .form-container { padding: 40px; }
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
        }
        .info-box p { color: #555; font-size: 14px; margin: 5px 0; }
        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #f5f5f5;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .btn-back:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Join Waitlist</h1>
            <p>We'll notify you when a slot opens up</p>
        </div>
        <div class="form-container">
            <div class="info-box">
                <p><strong>Doctor:</strong> Dr. {{ doctor.name }}</p>
                <p><strong>Clinic:</strong> {{ doctor.clinicname }}, {{ doctor.city }}</p>
                <p><strong>Fee:</strong> ₹{{ doctor.consultationfee }}</p>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="preferred_date">Preferred Date *</label>
                    <input type="date" name="preferred_date" id="preferred_date" required>
                </div>
                <div class="form-group">
                    <label for="preferred_time">Preferred Time (Optional)</label>
                    <input type="time" name="preferred_time" id="preferred_time">
                </div>
                <div class="form-group">
                    <label for="notes">Additional Notes (Optional)</label>
                    <textarea name="notes" id="notes" placeholder="Any specific requirements..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Join Waitlist</button>
            </form>
            <a href="{% url 'patient_dashboard' email %}" class="btn-back">← Back to Dashboard</a>
        </div>
    </div>
    <script>
        document.getElementById('preferred_date').setAttribute('min', new Date().toISOString().split('T')[0]);
    </script>
</body>
</html>
